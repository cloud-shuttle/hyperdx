name: hdx-oss-test
services:
  # PostgreSQL Database (replacing MongoDB)
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: hyperdx
      POSTGRES_USER: hyperdx
      POSTGRES_PASSWORD: hyperdx
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - .volumes/postgres_test:/var/lib/postgresql/data
    ports:
      - 15432:5432
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hyperdx -d hyperdx"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ClickHouse Database
  ch-server:
    image: clickhouse/clickhouse-server:25.7-alpine
    ports:
      - 18123:8123 # http api
      - 19000:9000 # native
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      HYPERDX_OTEL_EXPORTER_CLICKHOUSE_DATABASE: default
    volumes:
      - ./docker/clickhouse/local/config.xml:/etc/clickhouse-server/config.xml
      - ./docker/clickhouse/local/users.xml:/etc/clickhouse-server/users.xml
      - ./docker/clickhouse/local/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
      - .volumes/ch_data_test:/var/lib/clickhouse
      - .volumes/ch_logs_test:/var/log/clickhouse-server
    restart: on-failure
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  internal:
    driver: bridge
